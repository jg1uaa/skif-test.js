<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <title>skif-test-js</title>
  <style>
   body { font-family: monospace; }
   #output { white-space: pre-wrap; word-break: break-all; }
  </style>    
  <script src="js/main.js" type="module" defer></script>
 </head>
 <body>
  <div class="control-panel">

   <div class="control-group">
    <label class="group-title">Language</label>
    <label class="radio-label"><input type="radio" name="lang" value="EN" checked> English</label>
    <label class="radio-label"><input type="radio" name="lang" value="JP"> Japanese</label>
   </div>

   <div class="control-group">
    <label class="group-title">Display</label>
    <label class="radio-label"><input type="radio" name="display" value="simple" checked> Simple</label>
    <label class="radio-label"><input type="radio" name="display" value="verbose"> Verbose</label>
   </div>

   <div class="control-group">
    <label class="group-title">Interface</label>
    <label class="radio-label"><input type="radio" name="interface" value="hid" checked>HID (Keyboard/Mouse)</label>
    <label class="radio-label"><input type="radio" name="interface" value="dsr"> Serial (DSR/DTR signal)</label>
    <label class="radio-label"><input type="radio" name="interface" value="skif"> Serial (SKIF protocol)</label>
   </div>

   <div class="control-group">
     <label class="group-title">Speed</label>
     <label class="radio-label"><input type="number" id="wpm" value="12" min="4" max="30"> WPM</label>
   </div>

  </div>

  <button id="start-btn">START</button>
  <hr>
  <div id="output"></div>
  
 </body>
</html>
